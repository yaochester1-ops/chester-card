<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍅 番茄钟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #1f2328;
      margin-bottom: 24px;
    }

    .task-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 32px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .task-input:focus { border-color: #764ba2; }
    .task-input:disabled { background: #f6f8fa; color: #6b7280; }

    .timer {
      text-align: center;
      font-size: 96px;
      font-weight: 700;
      color: #1f2328;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .timer.work { color: #ef4444; }
    .timer.break { color: #10b981; }

    .mode-label {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(118, 92, 162, 0.4); }
    .btn-secondary {
      background: #f6f8fa;
      color: #1f2328;
    }
    .btn-secondary:hover { background: #e5e7eb; }

    .history {
      border-top: 1px solid #e5e7eb;
      padding-top: 24px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .history-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2328;
    }
    .history-count {
      font-size: 14px;
      color: #6b7280;
    }
    .history-empty {
      text-align: center;
      color: #9ca3af;
      padding: 24px 0;
      font-size: 14px;
    }
    .history-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f6f8fa;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .history-item .task-name {
      color: #1f2328;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 12px;
    }
    .history-item .task-time {
      color: #6b7280;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .history-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
    }
    .history-clear:hover { background: #fee2e2; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍅 番茄钟</h1>

    <input
      id="taskInput"
      class="task-input"
      type="text"
      placeholder="现在要做什么？比如：做数学作业"
      maxlength="40"
    >

    <div id="timer" class="timer work">25:00</div>
    <div id="modeLabel" class="mode-label">专注时间</div>

    <div class="buttons">
      <button id="startBtn" class="btn btn-primary">开始</button>
      <button id="resetBtn" class="btn btn-secondary">重置</button>
    </div>

    <div class="history">
      <div class="history-header">
        <span class="history-title">今日完成</span>
        <span><span id="count" class="history-count">0</span> 个 <button id="clearBtn" class="history-clear" style="display:none">清空</button></span>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <div id="historyEmpty" class="history-empty">完成第一个番茄就出现在这里</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'pomodoro-history-v1';
    const WORK_SECONDS = 25 * 60;
    const BREAK_SECONDS = 5 * 60;

    const els = {
      taskInput: document.getElementById('taskInput'),
      timer:     document.getElementById('timer'),
      modeLabel: document.getElementById('modeLabel'),
      startBtn:  document.getElementById('startBtn'),
      resetBtn:  document.getElementById('resetBtn'),
      historyList: document.getElementById('historyList'),
      historyEmpty: document.getElementById('historyEmpty'),
      count:     document.getElementById('count'),
      clearBtn:  document.getElementById('clearBtn'),
    };

    let mode = 'work';            // 'work' | 'break'
    let secondsLeft = WORK_SECONDS;
    let running = false;
    let intervalId = null;
    let history = loadHistory();
    renderHistory();

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function formatClock(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function renderTimer() {
      els.timer.textContent = formatTime(secondsLeft);
      els.timer.className = `timer ${mode}`;
      els.modeLabel.textContent = mode === 'work' ? '专注时间' : '休息一下';
      els.startBtn.textContent = running ? '暂停' : '开始';
      document.title = `${formatTime(secondsLeft)} · 番茄钟`;
    }

    function renderHistory() {
      const today = new Date().toDateString();
      const todayList = history.filter(h => new Date(h.timestamp).toDateString() === today);
      els.count.textContent = todayList.length;
      els.clearBtn.style.display = history.length > 0 ? '' : 'none';

      if (todayList.length === 0) {
        els.historyEmpty.style.display = '';
        els.historyList.innerHTML = '';
        return;
      }
      els.historyEmpty.style.display = 'none';
      els.historyList.innerHTML = todayList.slice().reverse().map(h => `
        <li class="history-item">
          <span class="task-name">${escapeHtml(h.task || '未命名任务')}</span>
          <span class="task-time">${formatClock(new Date(h.timestamp))}</span>
        </li>
      `).join('');
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function tick() {
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        finish();
        return;
      }
      renderTimer();
    }

    function start() {
      if (running) {
        pause();
        return;
      }
      running = true;
      els.taskInput.disabled = true;
      intervalId = setInterval(tick, 1000);
      renderTimer();
    }

    function pause() {
      running = false;
      clearInterval(intervalId);
      renderTimer();
    }

    function reset() {
      pause();
      mode = 'work';
      secondsLeft = WORK_SECONDS;
      els.taskInput.disabled = false;
      renderTimer();
    }

    function finish() {
      pause();
      if (mode === 'work') {
        history.push({
          task: els.taskInput.value.trim(),
          timestamp: Date.now(),
        });
        saveHistory();
        renderHistory();
        notify('🎉 完成一个番茄！休息 5 分钟吧');
        mode = 'break';
        secondsLeft = BREAK_SECONDS;
      } else {
        notify('☕ 休息结束，开始下一个番茄');
        mode = 'work';
        secondsLeft = WORK_SECONDS;
        els.taskInput.disabled = false;
      }
      renderTimer();
    }

    function notify(msg) {
      // 简单的页面提醒；想换成桌面通知见 NOTES.md 加分项
      alert(msg);
    }

    function clearHistory() {
      if (!confirm('清空所有历史记录？')) return;
      history = [];
      saveHistory();
      renderHistory();
    }

    els.startBtn.addEventListener('click', start);
    els.resetBtn.addEventListener('click', reset);
    els.clearBtn.addEventListener('click', clearHistory);

    renderTimer();
  </script>
</body>
</html>
